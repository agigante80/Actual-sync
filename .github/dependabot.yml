version: 2
updates:
  # Monitor npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    # Target the integration branch, not the default branch (main). main is
    # production; merging a dep PR there auto-cuts a release. Landing dep updates
    # on development lets them batch through normal CI and one promotion to main.
    target-branch: "development"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    reviewers:
      - "agigante80"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group non-critical updates
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "@actual-app/api"
        update-types:
          - "minor"
          - "patch"
    # @actual-app/api is owned END-TO-END by .github/workflows/dependency-update.yml
    # (the "Actual API Release Train"), which auto-publishes every forward move
    # including MAJORS. Dependabot must therefore ignore it entirely — no
    # update-types filter. Narrowing this back to patch/minor would make every
    # major produce BOTH a Dependabot PR and an auto-published release.
    ignore:
      - dependency-name: "@actual-app/api"
        
  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    # Same rationale as npm above: target development, not main.
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Europe/Madrid"
    reviewers:
      - "agigante80"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
