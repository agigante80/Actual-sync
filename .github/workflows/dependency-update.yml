name: Dependency Update Check

on:
  schedule:
    # Run daily at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  check-updates:
    name: Check for Actual API Updates
    runs-on: ubuntu-latest
    # Bound the job well under the 60-minute GitHub App installation-token
    # lifetime, so the token minted before the push steps can never expire
    # mid-run (a hung test phase is masked by continue-on-error on the test step).
    timeout-minutes: 30

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
          # Do NOT persist credentials: npm ci + npm test below execute the
          # freshly-bumped @actual-app/api code, and we don't want a write-scoped
          # token sitting in .git/config while untrusted package code runs. The
          # App token is minted later and used only for the push steps.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Get current version
        id: current
        run: |
          CURRENT=$(node -p "require('./package.json').dependencies['@actual-app/api']" | sed 's/[\^~]//g')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current @actual-app/api version: $CURRENT"

      - name: Check latest version
        id: latest
        run: |
          LATEST=$(npm show @actual-app/api version)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest @actual-app/api version: $LATEST"

      - name: Compare versions
        id: compare
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          CURRENT_MAJOR="${CURRENT%%.*}"
          LATEST_MAJOR="${LATEST%%.*}"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "major_available=false" >> $GITHUB_OUTPUT
            echo "Already on latest: $CURRENT"
          elif [ "$LATEST_MAJOR" -gt "$CURRENT_MAJOR" ]; then
            # A new MAJOR is owned by the Dependabot PR flow (dependabot.yml
            # ignores only patch/minor for @actual-app/api, so it opens a PR for
            # majors). This workflow auto-merges same-major updates only, so the
            # two mechanisms never collide on a major release.
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "major_available=true" >> $GITHUB_OUTPUT
            echo "Major release available: $CURRENT → $LATEST — left to Dependabot / manual review"
          elif [ "$LATEST_MAJOR" -lt "$CURRENT_MAJOR" ]; then
            # Latest dist-tag is behind the installed version (a rare upstream
            # regression, or package.json set ahead). Never auto-downgrade.
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "major_available=false" >> $GITHUB_OUTPUT
            echo "::warning::Latest published $LATEST is behind installed $CURRENT — no action"
          else
            # Same major, different version. Only proceed for a forward move;
            # a same-major downgrade would be a no-op under the ^ range anyway.
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "major_available=false" >> $GITHUB_OUTPUT
            echo "Same-major update available: $CURRENT → $LATEST"
          fi

      - name: Configure git identity
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create update branch
        if: steps.compare.outputs.update_needed == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          git checkout -b deps/actual-api-$LATEST

      - name: Update package.json
        if: steps.compare.outputs.update_needed == 'true'
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          npm install --package-lock-only @actual-app/api@^$LATEST
          git add package.json package-lock.json
          git commit -m "chore(deps): bump @actual-app/api from $CURRENT to $LATEST"

      - name: Install dependencies for test run
        if: steps.compare.outputs.update_needed == 'true'
        run: npm ci

      - name: Run tests
        if: steps.compare.outputs.update_needed == 'true'
        id: tests
        run: npm test -- --ci
        continue-on-error: true

      # Mint the write-scoped App token only now — after the untrusted package
      # code has finished running (npm ci/npm test) and immediately before the
      # push steps that need it. Pushes made with the default GITHUB_TOKEN do not
      # trigger workflow runs on the same repo, so ci-cd.yml would never fire on
      # the auto-merged bump commit; the App token makes downstream CI trigger.
      - name: Generate GitHub App token
        id: token
        if: steps.compare.outputs.update_needed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Merge to development (tests passed)
        if: steps.compare.outputs.update_needed == 'true' && steps.tests.outcome == 'success'
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout development
          git merge --no-ff deps/actual-api-$LATEST -m "chore(deps): merge @actual-app/api bump to $LATEST into development"
          git push origin development
          git branch -d deps/actual-api-$LATEST
          # A previous FAILED run of this same version pushed the working branch
          # to origin (see the failure path below). Now that it's merged, delete
          # that stale remote branch too; harmless no-op if it was never pushed.
          git push origin --delete deps/actual-api-$LATEST 2>/dev/null || true
          echo "### ✅ Merged @actual-app/api $LATEST into development" >> $GITHUB_STEP_SUMMARY

      - name: Push branch for inspection (tests failed)
        if: steps.compare.outputs.update_needed == 'true' && steps.tests.outcome != 'success'
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Force-push: a prior failed run of this same version may have left a
          # remote branch, and this run recreates it from a newer development tip
          # (different SHA, not a fast-forward). Force keeps the inspection branch
          # at the current state instead of failing the step on non-fast-forward.
          git push --force origin deps/actual-api-$LATEST
          echo "### ⚠️ Tests failed — branch deps/actual-api-$LATEST pushed for manual inspection" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Major update available (left to Dependabot)
        if: steps.compare.outputs.major_available == 'true'
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          echo "### ⏭️ Major @actual-app/api update available" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`$CURRENT\` → \`$LATEST\` crosses a major version. This workflow auto-merges only same-major (patch/minor) updates; the major bump is left to the Dependabot PR for manual review (see docs/CI_CD.md)." >> $GITHUB_STEP_SUMMARY

      - name: No update needed
        if: steps.compare.outputs.update_needed == 'false' && steps.compare.outputs.major_available == 'false'
        env:
          CURRENT: ${{ steps.current.outputs.version }}
        run: |
          echo "### ✅ Already Up to Date" >> $GITHUB_STEP_SUMMARY
          echo "Current version $CURRENT is the latest." >> $GITHUB_STEP_SUMMARY
