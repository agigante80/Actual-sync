name: Action pins

# Guard (#249): every `uses:` in .github/ must be a 40-hex commit SHA with a
# trailing `# vX.Y.Z` comment. Runs on every push and PR with no path filter so
# it can be a required check without stalling on PRs that touch no workflow.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  pins:
    name: Check action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-action-pins.sh
      - run: bash scripts/test-action-pins.sh
