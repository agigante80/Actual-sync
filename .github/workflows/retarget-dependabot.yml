name: Retarget Dependabot PRs

# WHY THIS EXISTS
#
# `target-branch` in dependabot.yml is honoured for VERSION updates only.
# Dependabot SECURITY updates ignore it and always open against the DEFAULT
# branch — here, `main`. That is a documented platform limitation
# (dependabot/dependabot-core#2767, open since 2020), not something fixable in
# YAML. It matters more here than in most repos: every green CI run on `main`
# triggers auto-release.yml, which tags and publishes. PR #192 arrived this way.
#
# So we move them afterwards: any open Dependabot PR based on `main` gets its
# base changed to `development`, where every other dependency update lands.
#
# WHY A SCHEDULE AND NOT pull_request_target
#
# The obvious design is `pull_request_target` on PR open. It was written that
# way and changed, because it cannot get the token it needs.
#
# A Dependabot-initiated run gets a read-only GITHUB_TOKEN and no access to
# Actions secrets, so `secrets.APP_ID` would resolve empty and the App token
# step would fail — on exactly the PRs this exists for. GitHub's own docs are
# self-contradictory about whether `pull_request_target` is included: it is
# absent from the read-only event list, but the separate `pull_request_target`
# clause is glossed as `github.event.pull_request.user.login ==
# 'dependabot[bot]'`, which is every Dependabot PR. Rather than depend on which
# reading is operative — or require someone to duplicate the App secrets into
# the separate Dependabot secrets store — this runs on a schedule.
#
# A scheduled run is not Dependabot-initiated, so it gets normal Actions secrets
# and a normal token. The cost is latency: a security PR may sit on `main` for
# up to an hour. Nothing merges it in that window, and `main` is protected by
# the same review as any other branch.
#
# NOTE ON ACTIVATION: scheduled workflows only run from the DEFAULT branch. This
# does nothing until merged to `main`. `npm run drift:check` reports that (#204).

on:
  schedule:
    # Hourly. Dependabot itself runs daily, but a security advisory can land at
    # any time and the job is a couple of API calls.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: retarget-dependabot
  cancel-in-progress: false

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Retarget any Dependabot PR sitting on main
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Dependabot's login appears as `app/dependabot` via gh and
          # `dependabot[bot]` via the raw API — and matching an exact list meant
          # a third spelling would yield an empty result, "Nothing to do", and
          # exit 0. Substring match instead: over-matching here would only
          # retarget a PR that already belongs on development.
          #
          # `deps/actual-api-*` is the Actual API release train, which is
          # App-authored and MUST keep targeting main — retargeting it would
          # break the merge-to-main-then-publish chain. The author filter
          # already excludes it; this is belt and braces because silently
          # breaking the train would be expensive and the guard costs a line.
          # --limit is explicit: the default is 30, and silently processing the
          # first 30 while exiting 0 is the false all-clear this repo keeps
          # getting bitten by. 100 is far above any plausible backlog.
          PRS=$(gh pr list --repo "$REPO" --base main --state open --limit 100 \
                  --json number,author,headRefName \
                  --jq '.[]
                        | select(.author.login | ascii_downcase | contains("dependabot"))
                        | select((.headRefName | startswith("deps/actual-api-")) | not)
                        | .number')

          if [ -z "$PRS" ]; then
            echo "No Dependabot PRs based on main. Nothing to do."
            exit 0
          fi

          FAILED=0
          for PR in $PRS; do
            echo "::group::PR #${PR}"
            if ! gh pr edit "$PR" --repo "$REPO" --base development; then
              echo "::error::Failed to retarget PR #${PR}"
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            # Verify rather than trust the exit code. An automation that
            # silently does nothing is worse than one that fails — same
            # reasoning as the release train's "Verify the release chain
            # actually started" step.
            # Guarded assignment: under `set -e` a bare `BASE=$(...)` that fails
            # aborts the entire loop, stranding every remaining PR on main —
            # while the two adjacent failure paths deliberately `continue`.
            if ! BASE=$(gh pr view "$PR" --repo "$REPO" --json baseRefName --jq .baseRefName); then
              echo "::error::Could not read the base of PR #${PR} after retargeting it"
              FAILED=1
              echo "::endgroup::"
              continue
            fi
            if [ "$BASE" != "development" ]; then
              echo "::error::PR #${PR} is still based on '${BASE}' — retarget failed."
              FAILED=1
              echo "::endgroup::"
              continue
            fi
            echo "PR #${PR} is now based on '${BASE}'."

            # ---------------------------------------------------------------
            # RE-TEST AGAINST THE NEW BASE (#205)
            #
            # Changing a base fires `pull_request` `edited`, which ci-cd.yml
            # does not listen for — so without this the PR keeps the check it
            # earned against `main` and can be merged into `development` having
            # never been tested there.
            #
            # Verified on scratch PR #214 before shipping: retargeting alone
            # fired NO run; close+reopen fired a fresh `pull_request` run whose
            # `pull_requests[0].base.ref` was `development`, and a deliberately
            # failing PR stayed RED across it. `reopened` works because
            # ci-cd.yml declares no `types:`, so it gets GitHub's default
            # (opened, synchronize, reopened) — this needs no change to
            # ci-cd.yml, which matters: the previous attempt at #205 DID edit
            # that file, and an all-skipped run turned a red PR green (5aaf131).
            #
            # FAIL-SAFE ORDERING. The red status is posted BEFORE the close, and
            # only cleared after the reopen is confirmed. Every failure path in
            # between therefore leaves the PR visibly not-green rather than
            # showing the stale green from `main`. Do not reorder these.
            # ---------------------------------------------------------------
            if ! HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid); then
              echo "::error::Could not read the head SHA of PR #${PR}; not touching its state."
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            # Best-effort like the comment below (#206): the App may lack
            # `statuses: write`. Losing the marker must not cost the retarget,
            # which has already happened and been verified.
            post_status() {
              gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
                -f state="$1" \
                -f context="retarget/re-tested-against-development" \
                -f description="$2" >/dev/null \
                || echo "::warning::Could not post commit status '$1' on PR #${PR}."
            }

            post_status "failure" "Base moved to development; awaiting a re-run. The existing check was computed against main."

            # Snapshot the highest run id already attached to this head SHA.
            # The PR's ORIGINAL main-based runs carry the same head SHA, so
            # "a run exists" proves nothing — only "a run NEWER than this one
            # exists" does. Run ids increase monotonically, which makes a single
            # integer enough. Verified: `gh run list --commit <sha>` returns the
            # pre- and post-reopen runs together.
            # Scoped to ci-cd.yml, NOT "any run on this SHA". codeql-analysis.yml
            # also fires on pull_request and carries no paths-ignore, while
            # ci-cd.yml's does — so any future skew (a paths-ignore hit,
            # `development` dropped from ci-cd's branches, an explicit `types:`
            # that omits `reopened`) would produce a fresh CodeQL run id and a
            # green marker although the suite never ran. The evidence has to be
            # the thing being claimed.
            #
            # Fails CLOSED. `|| echo 0` here would be a live false-green path: a
            # transient gh failure (502, secondary rate limit, a missing
            # `actions: read` scope) would set the baseline to 0, the first poll
            # would return the max id of the PR's ORIGINAL main-based runs, and
            # `> 0` would pass. That is mutation 210-existence-not-freshness,
            # reachable at runtime. An unusable snapshot means the evidence check
            # cannot be trusted, so it is skipped and the status stays red.
            SNAPSHOT_OK=1
            if ! RUNS_BEFORE=$(gh run list --repo "$REPO" --commit "$HEAD_SHA" \
                                 --workflow ci-cd.yml --limit 100 \
                                 --json databaseId --jq '[.[].databaseId] | max // 0'); then
              SNAPSHOT_OK=0
              echo "::warning::Could not snapshot existing runs for PR #${PR}; the re-test cannot be verified and its status stays red."
            fi
            case "$RUNS_BEFORE" in
              ''|*[!0-9]*) SNAPSHOT_OK=0; RUNS_BEFORE=0 ;;
            esac

            # Close+reopen is the trigger. The risk is that Dependabot reads a
            # close as "do not recreate this version" — unverifiable here
            # without a live security PR, so it is engineered around rather than
            # assumed away: the reopen is retried, and a PR left closed fails
            # the job loudly instead of being silently abandoned.
            if ! gh pr close "$PR" --repo "$REPO" >/dev/null; then
              echo "::warning::Could not close PR #${PR} to re-trigger CI; it keeps its stale check and the red status above."
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            REOPENED=0
            for attempt in 1 2 3; do
              if gh pr reopen "$PR" --repo "$REPO" >/dev/null; then
                REOPENED=1
                break
              fi
              echo "::warning::Reopen attempt ${attempt} for PR #${PR} failed; retrying."
              sleep 5
            done

            if [ "$REOPENED" -ne 1 ]; then
              # The one genuinely bad outcome: a security PR left closed.
              echo "::error::PR #${PR} was closed to re-trigger CI and could NOT be reopened. Reopen it by hand — a closed security PR may not be recreated by Dependabot."
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            # ---------------------------------------------------------------
            # PROVE THE RE-TEST HAPPENED (#210)
            #
            # A CONFLICTING PR produces NO CI run at all — GitHub cannot compute
            # refs/pull/N/merge, so ci-cd.yml never fires, and close+reopen does
            # NOT change that. Verified on scratch PR #215: zero runs across ~7
            # minutes, then zero more across ~3.5 minutes after a close+reopen.
            #
            # That is the normal case here, not the edge case: a retargeted PR
            # branched from `main` while `development` is ahead on VERSION and
            # package.json, so it conflicts on those alone.
            #
            # Clearing the status on the strength of a successful reopen would
            # therefore post a GREEN "re-tested" marker on a PR with no CI
            # whatsoever, while main's stale checks sit on the same SHA. Assert
            # the evidence instead of the intention.
            # ---------------------------------------------------------------
            RETESTED=0
            if [ "$SNAPSHOT_OK" -eq 1 ]; then
              for _ in $(seq 1 12); do
                sleep 5
                # Same fail-closed rule: a failed poll is not evidence of
                # anything, so it must not be read as a run id.
                if ! LATEST=$(gh run list --repo "$REPO" --commit "$HEAD_SHA" \
                                --workflow ci-cd.yml --limit 100 \
                                --json databaseId --jq '[.[].databaseId] | max // 0'); then
                  continue
                fi
                case "$LATEST" in ''|*[!0-9]*) continue ;; esac
                if [ "$LATEST" -gt "$RUNS_BEFORE" ]; then
                  RETESTED=1
                  break
                fi
              done
            fi

            # The courtesy comment must agree with the status. It used to assert
            # "the checks now on it were computed against development"
            # unconditionally — so on the normal conflicting-PR case the status
            # went red while the comment beside it made exactly the claim the
            # status was refusing to make.
            if [ "$RETESTED" -eq 1 ]; then
              post_status "success" "Re-tested against development after retargeting."
              echo "PR #${PR} closed and reopened; a new CI run started against '${BASE}'."
              RETEST_NOTE="This PR was **closed and reopened** to re-trigger CI, because changing a base does not do so on its own (#205). The checks now on it were computed against \`development\`. If you see it briefly closed, that is this workflow, not a human."
            elif [ "$SNAPSHOT_OK" -ne 1 ]; then
              # Third branch, and it is NOT cosmetic. Without it a failed
              # snapshot fell through to the else and told the maintainer, in a
              # public comment, that no CI run appeared and a conflict needed
              # resolving — when nothing had been observed at all and CI may
              # well have run green. "I could not check" and "I checked and
              # found nothing" are different claims; collapsing them is the same
              # false-confidence error in the opposite direction.
              post_status "failure" "Could not verify whether CI re-ran after retargeting. Check this PR's checks by hand before merging."
              echo "::warning::PR #${PR}: the re-test could not be VERIFIED (the run snapshot failed) — this is not evidence that CI did or did not run. Check by hand."
              RETEST_NOTE="This PR was **closed and reopened** to re-trigger CI (#205), but this job **could not verify** whether a run started — the GitHub API call failed, so nothing was observed either way. **Check this PR's checks by hand before merging**, and treat any check older than the reopen as computed against \`main\`."
            else
              # Deliberately does NOT assert "conflict". No run can also mean
              # paths-ignore, a disabled workflow, or a stuck queue. Report what
              # was observed and name the likely cause — overclaiming here would
              # be the same false-confidence error in a new coat.
              post_status "failure" "No CI run appeared after retargeting — most likely a merge conflict with development. Resolve it, then re-run CI."
              echo "::warning::PR #${PR} was retargeted, but no CI run appeared within 60s. Most likely it conflicts with '${BASE}' — a conflicting PR cannot be tested at all. Its commit status is left red."
              RETEST_NOTE="This PR was **closed and reopened** to re-trigger CI (#205), but **no CI run appeared** — most likely it now conflicts with \`development\`, and a conflicting PR cannot be tested at all because GitHub never computes its merge ref (#210). **The checks shown here were computed against \`main\`.** Resolve the conflict, then re-run CI before merging."
            fi

            # NOTE: no mergeability check here. A retargeted PR CAN be
            # unmergeable — it branched from main while development is ahead on
            # VERSION/package.json, and Dependabot cannot rebase a base it did
            # not choose. But GitHub computes mergeability asynchronously, so
            # reading it immediately after the edit returns UNKNOWN and a
            # CONFLICTING check would essentially never fire. A check that
            # cannot fire is worse than none: it reads as coverage.
            #
            # #210 is now CLOSED, and not by adding that check back: the
            # evidence loop above answers the same question by direct
            # observation ("did a ci-cd run actually start?") instead of the
            # `mergeable` proxy. Do not reintroduce a mergeability read here.

            # Non-fatal (#206): the retarget has already happened and been
            # verified, so a permission gap here should cost the courtesy note,
            # not the job. This posts to the issue-comments endpoint, which
            # GitHub scopes by target type — the one call not already proven by
            # the release train's own use of this App.
            # Body is piped in, one argument per line, rather than written as
            # an indented multi-line string. Continuation lines used to keep
            # their YAML indentation, and GitHub Markdown renders an indented
            # line following a blank one as a CODE BLOCK — so the "Re-run CI"
            # warning posted as preformatted text instead of a readable
            # sentence. printf with one %s per line has no indentation to strip.
            printf '%s\n' \
              "Retargeted \`main\` → \`development\` automatically by \`.github/workflows/retarget-dependabot.yml\`." \
              "" \
              "Dependabot security updates always open against the default branch and cannot be configured otherwise. \`main\` is production here — a green CI run on it auto-cuts a release — so dependency updates are landed on \`development\` and promoted deliberately." \
              "" \
              "$RETEST_NOTE" \
              "" \
              "If this is a transitive-only change (\`package-lock.json\` with no \`package.json\` edit), do not merge it: both npm entries in \`dependabot.yml\` allow direct dependencies only, so it should not exist. Clear the advisory with \`npm update\` instead — a patched release is usually already inside the parent's declared range. See the Dependency Policy in \`CLAUDE.md\`." \
              | gh pr comment "$PR" --repo "$REPO" --body-file - \
              || echo "::warning::Could not comment on PR #${PR}; retarget itself succeeded."

            echo "::endgroup::"
          done

          exit "$FAILED"
